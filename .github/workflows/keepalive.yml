name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake up Render
        run: |
          BASE_URL="${RENDER_URL:-https://task-scheduling-agent-api.onrender.com}"
          URL="${BASE_URL%/}/live"

          echo "Waking Render service at $URL"

          for i in {1..18}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i -> HTTP $status"

            if [ "$status" = "200" ]; then
              echo "Render is awake"
              exit 0
            fi

            sleep 10
          done

          echo "Render never woke up"
          exit 1
