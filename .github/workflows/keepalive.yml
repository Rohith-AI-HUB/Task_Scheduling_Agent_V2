name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake up Render
        run: |
          BASE_URL="${RENDER_URL:-https://task-scheduling-agent-api.onrender.com}"
          URL="${BASE_URL%/}/health"
          status=$(curl -sS -o /dev/null -w "%{http_code}" --retry 5 --retry-all-errors --max-time 20 "$URL")
          echo "Pinged $URL -> HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            exit 1
          fi
